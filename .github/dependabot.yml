version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      time: '13:00'
    assignees:
      - vincentvdwal
    open-pull-requests-limit: 10
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
    commit-message:
      prefix: 'chore(deps): '
    cooldown:
      default-days: 7
    groups:
      openmeteo:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
      time: '10:00'
    assignees:
      - vincentvdwal
    commit-message:
      prefix: 'chore(deps): '
    cooldown:
      default-days: 7
