<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Mapbox Layer - Great Britain Bounds Clip</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
		<style>
			html,
			body,
			#map {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script type="module">
			import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs';

			const OMWeatherMapLayer = await import(
				location.hostname === 'localhost'
					? '../../../dist/index.mjs' // local development
					: 'https://unpkg.com/@openmeteo/weather-map-layer@0.3.1/dist/index.mjs' // x-release-please-version
			);

			const greatBritainBounds = [-8.65, 49.86, 1.77, 60.86];

			const omProtocolOptions = OMWeatherMapLayer.defaultOmProtocolSettings;
			omProtocolOptions.clippingOptions = {
				bounds: greatBritainBounds
			};

			maplibregl.addProtocol('om', (params, abortController) =>
				OMWeatherMapLayer.omProtocol(params, abortController, omProtocolOptions)
			);

			const map = new maplibregl.Map({
				container: 'map',
				style: 'https://static-assets.open-meteo.com/map-assets/styles/minimal-planet-maps.json', // replace with your own style sheet
				center: [-3.436, 55.3781],
				zoom: 4.5,
				hash: true
			});

			const omUrl =
				'https://openmeteo.s3.amazonaws.com/data_spatial/ukmo_uk_deterministic_2km/latest.json?time_step=current_time_1H&variable=temperature_2m';

			map.on('load', () => {
				map.addSource('omFileSource', {
					url: 'om://' + omUrl,
					type: 'raster'
				});
				map.addLayer(
					{
						id: 'omFileLayer',
						type: 'raster',
						source: 'omFileSource',
						paint: {
							'raster-opacity': 0.75
						}
					},
					'waterway-tunnel'
				);
			});
		</script>
	</body>
</html>
