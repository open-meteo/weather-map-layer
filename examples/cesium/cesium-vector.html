<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Weather Map Layer - CesiumJS Vector Example</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			rel="stylesheet"
			href="https://unpkg.com/cesium@1.146.0/Build/Cesium/Widgets/widgets.css"
		/>
		<script src="https://unpkg.com/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
		<style>
			html,
			body,
			#cesiumContainer {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="cesiumContainer"></div>
		<script type="module">
			const OMWeatherMapLayer = await import(
				location.hostname === 'localhost'
					? '../../dist/index.mjs' // local development
					: 'https://unpkg.com/@openmeteo/weather-map-layer@0.2.2/dist/index.mjs' // x-release-please-version
			);

			// The adapter turns "om://" URLs into Cesium layers whose tiles are rendered by omProtocol:
			// a raster imagery provider, and a polyline layer built from the vector tiles (arrows).
			const cesiumAdapter = OMWeatherMapLayer.addCesiumProtocolSupport(Cesium);
			cesiumAdapter.addProtocol('om', OMWeatherMapLayer.omProtocol);

			// Natural Earth II ships with Cesium, so no Cesium ion token is needed for the base map.
			const viewer = new Cesium.Viewer('cesiumContainer', {
				baseLayer: Cesium.ImageryLayer.fromProviderAsync(
					Cesium.TileMapServiceImageryProvider.fromUrl(
						Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
					)
				),
				baseLayerPicker: false,
				geocoder: false,
				timeline: false,
				animation: false
			});

			// Only the data covering the view is read; without this the whole
			// model file is downloaded on the first tile.
			viewer.camera.moveEnd.addEventListener(() => {
				const rectangle = viewer.camera.computeViewRectangle();
				if (!rectangle) return; // the globe does not fill the view: keep the previous bounds
				OMWeatherMapLayer.updateCurrentBounds([
					Cesium.Math.toDegrees(rectangle.west),
					Cesium.Math.toDegrees(rectangle.south),
					Cesium.Math.toDegrees(rectangle.east),
					Cesium.Math.toDegrees(rectangle.north)
				]);
			});

			// Both layers share the same model file and time step. The vector layer appends `&arrows=true` to request PBF arrow tiles.
			const omUrl = `https://openmeteo.s3.amazonaws.com/data_spatial/dwd_icon/latest.json?time_step=current_time_1H&variable=wind_u_component_10m`;

			// Raster: wind speed.
			viewer.imageryLayers.add(
				Cesium.ImageryLayer.fromProviderAsync(
					cesiumAdapter.createImageryProvider('om://' + omUrl),
					{ alpha: 0.75 }
				)
			);

			// Vectors: the arrows covering the view are drawn as polylines in world space, fetched at
			// one zoom level derived from the camera height and refreshed on every moveEnd, so they keep
			// their line width on screen and their density over the globe. (createVectorImageryProvider
			// drapes them as imagery instead, for shapes that must follow terrain.)
			cesiumAdapter.addVectorLayer(viewer, 'om://' + omUrl + '&arrows=true', {
				style: (properties) => {
					const value = Number(properties.value) || 0;
					const alpha = value > 5 ? 0.6 : value > 4 ? 0.5 : value > 3 ? 0.4 : value > 2 ? 0.3 : 0.2;
					return {
						strokeStyle: `rgba(0, 0, 0, ${alpha})`,
						lineWidth: 2
					};
				}
			});

			viewer.camera.setView({
				destination: Cesium.Cartesian3.fromDegrees(10, 50, 5_000_000)
			});
		</script>
	</body>
</html>
