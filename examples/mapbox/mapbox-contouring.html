<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Weather Map Layer - Mapbox GL Contouring on Colorscale Example</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/mapbox-gl@3.30.0/dist/mapbox-gl.css" />
		<script src="https://unpkg.com/mapbox-gl@3.30.0/dist/mapbox-gl.js"></script>
		<style>
			html,
			body,
			#map {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script type="module">
			const OMWeatherMapLayer = await import(
				location.hostname === 'localhost'
					? '../../dist/index.mjs' // local development
					: 'https://unpkg.com/@openmeteo/weather-map-layer@0.2.0/dist/index.mjs' // x-release-please-version
			);

			mapboxgl.accessToken = 'XXX'; // replace with your Mapbox access token

			// The adapter turns "om://" URLs into Mapbox sources whose tiles are rendered by omProtocol:
			// a custom raster source, and a GeoJSON source fed with the vector tiles of the viewport.
			const mapboxAdapter = OMWeatherMapLayer.addMapboxProtocolSupport();
			mapboxAdapter.addProtocol('om', OMWeatherMapLayer.omProtocol);

			const map = new mapboxgl.Map({
				container: 'map',
				style: 'https://static-assets.open-meteo.com/map-assets/styles/minimal-planet-maps.json', // replace with your own style sheet
				hash: true
			});

			map.on('dataloading', () => {
				const bounds = map.getBounds();
				const [minLng, minLat] = bounds.getSouthWest().toArray();
				const [maxLng, maxLat] = bounds.getNorthEast().toArray();
				OMWeatherMapLayer.updateCurrentBounds([minLng, minLat, maxLng, maxLat]);
			});

			const omUrl = `https://openmeteo.s3.amazonaws.com/data_spatial/dwd_icon/latest.json?time_step=current_time_1H&variable=precipitation&contours=true`;

			map.on('load', () => {
				// Raster: a custom source (Mapbox's CustomSourceInterface), added like any other source.
				map.addSource(
					'omFileRasterSource',
					mapboxAdapter.createRasterSource('om://' + omUrl, { attribution: '© Open-Meteo' })
				);

				map.addLayer(
					{
						id: 'omFileRasterLayer',
						type: 'raster',
						source: 'omFileRasterSource',
						paint: {
							'raster-opacity': 0.75
						}
					},
					'waterway-tunnel'
				);

				// Contours: Mapbox custom sources carry raster data only, so the contour tiles covering
				// the viewport are decoded into a GeoJSON source that follows the map on every moveend.
				// The line layer selects the 'contours' features by their `layer` property.
				mapboxAdapter.addVectorSource(map, 'omFileVectorSource', 'om://' + omUrl);

				map.addLayer(
					{
						id: 'omFileVectorLayer',
						type: 'line',
						source: 'omFileVectorSource',
						filter: ['==', ['get', 'layer'], 'contours'],
						paint: {
							'line-color': 'rgba(0,0,0,0.85)',
							'line-width': 1
						}
					},
					'place_label_other'
				);
			});
		</script>
	</body>
</html>
