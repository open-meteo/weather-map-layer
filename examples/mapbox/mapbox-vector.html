<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Weather Map Layer - Mapbox GL Raster + Vector Example</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/mapbox-gl@3.30.0/dist/mapbox-gl.css" />
		<script src="https://unpkg.com/mapbox-gl@3.30.0/dist/mapbox-gl.js"></script>
		<!-- x-release-please-start-version -->
		<script src="https://unpkg.com/@openmeteo/weather-map-layer@0.1.1/dist/index.js"></script>
		<!-- x-release-please-end -->
		<!-- Local development -->
		<script>
			if (location.hostname === 'localhost' || location.href.startsWith('file://')) {
				document.write('<script src="../../dist/index.js"><\/script>');
			}
		</script>
		<style>
			html,
			body,
			#map {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script>
			mapboxgl.accessToken = 'XXX'; // replace with your Mapbox access token

			// The adapter turns "om://" URLs into Mapbox sources whose tiles are rendered by omProtocol:
			// a custom raster source, and a GeoJSON source fed with the vector tiles of the viewport.
			const mapboxAdapter = OMWeatherMapLayer.addMapboxProtocolSupport();
			mapboxAdapter.addProtocol('om', OMWeatherMapLayer.omProtocol);

			const map = new mapboxgl.Map({
				container: 'map',
				style: 'https://static-assets.open-meteo.com/map-assets/styles/minimal-planet-maps.json', // replace with your own style sheet
				hash: true
			});

			map.on('dataloading', () => {
				const bounds = map.getBounds();
				const [minLng, minLat] = bounds.getSouthWest().toArray();
				const [maxLng, maxLat] = bounds.getNorthEast().toArray();
				OMWeatherMapLayer.updateCurrentBounds([minLng, minLat, maxLng, maxLat]);
			});

			// Both layers share the same model file and time step. The vector layer appends `&arrows=true` to request PBF arrow tiles.
			const omUrl = `https://openmeteo.s3.amazonaws.com/data_spatial/dwd_icon/latest.json?time_step=current_time_1H&variable=wind_u_component_10m`;

			map.on('load', () => {
				// Raster: a custom source (Mapbox's CustomSourceInterface), added like any other source.
				map.addSource(
					'omRasterSource',
					mapboxAdapter.createRasterSource('om://' + omUrl, { attribution: '© Open-Meteo' })
				);

				map.addLayer(
					{
						id: 'omRasterLayer',
						type: 'raster',
						source: 'omRasterSource',
						paint: {
							'raster-opacity': 0.75
						}
					},
					'waterway-tunnel'
				);

				// Vectors: Mapbox custom sources carry raster data only, so the arrow tiles covering the
				// viewport are decoded into a GeoJSON source that follows the map on every moveend.
				// Style layers select their features with a filter on the `layer` property (the MVT
				// layer name: 'wind-arrows', 'wind-barb-pennants', 'contours', …) instead of source-layer.
				mapboxAdapter.addVectorSource(map, 'omVectorSource', 'om://' + omUrl + '&arrows=true');

				map.addLayer(
					{
						id: 'omVectorLayer',
						type: 'line',
						source: 'omVectorSource',
						filter: ['==', ['get', 'layer'], 'wind-arrows'],
						paint: {
							'line-color': [
								'case',
								['boolean', ['>', ['to-number', ['get', 'value']], 5], false],
								'rgba(0,0,0, 0.6)',
								[
									'case',
									['boolean', ['>', ['to-number', ['get', 'value']], 4], false],
									'rgba(0,0,0, 0.5)',
									[
										'case',
										['boolean', ['>', ['to-number', ['get', 'value']], 3], false],
										'rgba(0,0,0, 0.4)',
										[
											'case',
											['boolean', ['>', ['to-number', ['get', 'value']], 2], false],
											'rgba(0,0,0, 0.3)',
											'rgba(0,0,0, 0.2)'
										]
									]
								]
							],
							'line-width': 2
						},
						layout: {
							'line-cap': 'round'
						}
					},
					'place_label_other'
				);
			});
		</script>
	</body>
</html>
