<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Weather Map Layer - Mapbox GL Example</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/mapbox-gl@3.30.0/dist/mapbox-gl.css" />
		<script src="https://unpkg.com/mapbox-gl@3.30.0/dist/mapbox-gl.js"></script>
		<style>
			html,
			body,
			#map {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script type="module">
			const OMWeatherMapLayer = await import(
				location.hostname === 'localhost'
					? '../../dist/index.mjs' // local development
					: 'https://unpkg.com/@openmeteo/weather-map-layer@0.2.1/dist/index.mjs' // x-release-please-version
			);

			mapboxgl.accessToken = 'XXX'; // replace with your Mapbox access token

			// The adapter turns "om://" URLs into Mapbox custom sources whose tiles are rendered by omProtocol.
			const mapboxAdapter = OMWeatherMapLayer.addMapboxProtocolSupport();

			// Register the 'om' protocol handler (same as MapLibre's addProtocol).
			mapboxAdapter.addProtocol('om', OMWeatherMapLayer.omProtocol);

			const map = new mapboxgl.Map({
				container: 'map',
				style: 'https://static-assets.open-meteo.com/map-assets/styles/minimal-planet-maps.json', // replace with your own style sheet
				hash: true
			});

			map.on('dataloading', () => {
				const bounds = map.getBounds();
				const [minLng, minLat] = bounds.getSouthWest().toArray();
				const [maxLng, maxLat] = bounds.getNorthEast().toArray();
				OMWeatherMapLayer.updateCurrentBounds([minLng, minLat, maxLng, maxLat]);
			});

			// below url is used to request 'latest.json' and get the nearest timestep to "current local time" + 1 hour
			const omUrl = `https://openmeteo.s3.amazonaws.com/data_spatial/dwd_icon/latest.json?time_step=current_time_1H&variable=temperature_2m`;
			// example of an actual omUrl:
			// const omUrl = `om://https://openmeteo.s3.amazonaws.com/data_spatial/dwd_icon/2025/06/06/1200Z/2025-06-06T1200.om?variable=temperature_2m`;

			map.on('load', () => {
				// A custom raster source (Mapbox's CustomSourceInterface), added like any other source.
				map.addSource(
					'omFileSource',
					mapboxAdapter.createRasterSource('om://' + omUrl, { attribution: '© Open-Meteo' })
				);
				map.addLayer(
					{
						id: 'omFileLayer',
						type: 'raster',
						source: 'omFileSource',
						paint: {
							'raster-opacity': 0.75
						}
					},
					'waterway-tunnel'
				);
			});
		</script>
	</body>
</html>
