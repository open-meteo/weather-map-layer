<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Weather Map Layer - GPU Custom Layer Benchmark</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
		<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
		<!-- x-release-please-start-version -->
		<script src="https://unpkg.com/@openmeteo/weather-map-layer@0.1.0/dist/index.js"></script>
		<!-- x-release-please-end -->
		<!-- Local development -->
		<script>
			if (location.hostname === 'localhost' || location.href.startsWith('file://')) {
				document.write('<script src="../../dist/index.js"><\/script>');
			}
		</script>
		<style>
			body {
				font: 14px/1.5 sans-serif;
				margin: 20px;
				max-width: 1000px;
			}
			fieldset {
				display: inline-block;
				vertical-align: top;
				margin-right: 12px;
			}
			#fpsmap {
				width: 640px;
				height: 400px;
				border: 1px solid #ccc;
			}
			button {
				font-size: 14px;
				padding: 4px 12px;
			}
			.note {
				color: #666;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<h2>GPU custom layer frame rate</h2>

		<fieldset>
			<legend>Setup</legend>
			<label>
				Domain
				<select id="domain">
					<option value="dwd_icon" selected>dwd_icon (regular, global)</option>
					<option value="ncep_hrrr_conus">ncep_hrrr_conus (LCC projected)</option>
					<option value="dmi_harmonie_arome_europe">dmi_harmonie_arome_europe (LCC)</option>
				</select>
			</label>
			<label>
				Variable
				<select id="variable">
					<option value="temperature_2m" selected>temperature_2m</option>
					<option value="cloud_cover">cloud_cover</option>
					<option value="precipitation">precipitation</option>
				</select>
			</label>
			<label>
				Interpolation
				<select id="interpolation">
					<option value="nearest">nearest</option>
					<option value="linear" selected>linear</option>
					<option value="cubic">cubic</option>
					<option value="monotone">monotone</option>
				</select>
			</label>
		</fieldset>

		<p>
			<button id="runFps">Measure GPU layer FPS (3 s)</button>
		</p>
		<div id="log" class="note"></div>

		<div id="fpsmap"></div>
		<div id="fpsResult"></div>

		<script>
			const OM = OMWeatherMapLayer;
			const log = (message) => (document.getElementById('log').textContent = message);

			const settings = () => ({
				domain: document.getElementById('domain').value,
				variable: document.getElementById('variable').value,
				interpolation: document.getElementById('interpolation').value
			});

			const baseUrl = (s) =>
				`om://https://openmeteo.s3.amazonaws.com/data_spatial/${s.domain}/latest.json` +
				`?time_step=current_time_1H&variable=${s.variable}` +
				`&interpolation=${s.interpolation}`;

			let fpsMap;
			document.getElementById('runFps').onclick = async () => {
				const s = settings();
				if (!fpsMap) {
					fpsMap = new maplibregl.Map({
						container: 'fpsmap',
						style:
							'https://static-assets.open-meteo.com/map-assets/styles/minimal-planet-maps.json',
						center: [10, 50],
						zoom: 4
					});
					await new Promise((resolve) => fpsMap.on('load', resolve));
				}
				if (fpsMap.getLayer('bench-gpu-layer')) fpsMap.removeLayer('bench-gpu-layer');
				const layer = new OM.WeatherGpuLayer({ id: 'bench-gpu-layer', opacity: 0.75 });
				fpsMap.addLayer(layer);
				log('Loading layer data…');
				await layer.setUrl(baseUrl(s));

				log('Measuring… (forcing continuous repaints for 3 s)');
				let frames = 0;
				const onRender = () => {
					frames++;
					fpsMap.triggerRepaint();
				};
				fpsMap.on('render', onRender);
				fpsMap.triggerRepaint();
				await new Promise((resolve) => setTimeout(resolve, 3000));
				fpsMap.off('render', onRender);
				document.getElementById('fpsResult').textContent =
					`${(frames / 3).toFixed(0)} fps with full-viewport per-pixel ` +
					`${s.interpolation} interpolation of ${s.domain} (${s.variable})`;
				log('Done.');
			};
		</script>
	</body>
</html>
