<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Weather Map Layer - GPU Tile Protocol (Path A)</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
		<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
		<!-- x-release-please-start-version -->
		<script src="https://unpkg.com/@openmeteo/weather-map-layer@0.1.0/dist/index.js"></script>
		<!-- x-release-please-end -->
		<!-- Local development -->
		<script>
			if (location.hostname === 'localhost' || location.href.startsWith('file://')) {
				document.write('<script src="../../dist/index.js"><\/script>');
			}
		</script>
		<style>
			html,
			body,
			#map {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script>
			// Drop-in swap for omProtocol: identical tile pipeline, but the raster
			// tiles are rendered by a WebGL2 shader instead of the CPU worker loop.
			// Vector tiles / seamless domains / gaussian grids automatically fall
			// back to the CPU path.
			maplibregl.addProtocol('om', OMWeatherMapLayer.omProtocolGpu);

			const map = new maplibregl.Map({
				container: 'map',
				style: 'https://static-assets.open-meteo.com/map-assets/styles/minimal-planet-maps.json',
				hash: true
			});

			const omUrl = `https://openmeteo.s3.amazonaws.com/data_spatial/dwd_icon/latest.json?time_step=current_time_1H&variable=temperature_2m`;

			map.on('load', () => {
				map.addSource('omFileSource', {
					url: 'om://' + omUrl,
					type: 'raster',
					maxzoom: 12
				});
				map.addLayer(
					{
						id: 'omFileLayer',
						type: 'raster',
						source: 'omFileSource',
						paint: {
							'raster-opacity': 0.75
						}
					},
					'waterway-tunnel'
				);
			});
		</script>
	</body>
</html>
