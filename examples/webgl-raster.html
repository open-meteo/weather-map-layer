<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Mapbox Layer - Temperature Example</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
		<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
		<!-- x-release-please-start-version -->
		<script src="https://unpkg.com/@openmeteo/weather-map-layer@0.0.19/dist/index.js"></script>
		<!-- x-release-please-end -->
		<script>
			if (location.hostname === 'localhost' || location.href.startsWith('file://')) {
				document.write('<script src="../dist/index.js"><\/script>');
			}
		</script>
		<style>
			html,
			body,
			#map {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script>
			const map = new maplibregl.Map({
				container: 'map',
				style: 'https://map-assets.open-meteo.com/styles/minimal-planet-maps.json', // replace with your own style sheet
				center: [10.4515, 51.1657],
				zoom: 5,
				hash: true,
				contextAttributes: {
					webglVersion: 2
				}
			});

			// s3 storage structure: /data_spatial/{domain}/{modelRun /year/month/day/time}Z/{selectedTime year-month-day-time.om}?variable={variable}
			const omUrl = `https://map-tiles.open-meteo.com/data_spatial/dwd_icon/2026/07/30/1200Z/2026-07-30T1400.om`;
			const variableName = 'temperature_2m';

			const domain = OMWeatherMapLayer.domainOptions.find((d) => d.value === 'dwd_icon');
			console.log(domain);

			map.on('load', () => {
				const source = new OMWeatherMapLayer.WebGLWeatherDataSource(omUrl, domain);
				const webglLayer = new OMWeatherMapLayer.WebGLRasterLayer(
					'omFileLayer',
					source,
					variableName,
					{
						onError: (error) => console.error('WebGL raster layer:', error)
					}
				);
				map.addLayer(webglLayer);
			});
		</script>
	</body>
</html>
