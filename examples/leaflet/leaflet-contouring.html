<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Weather Map Layer - Leaflet Contouring on Colorscale Example</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
		<!-- Basemap only: MapLibre + the maplibre-gl-leaflet plugin render a vector style sheet as the Leaflet base layer (see the end of the module script). The weather layers need neither. -->
		<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
		<style>
			html,
			body,
			#map {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script type="module">
			const OMWeatherMapLayer = await import(
				location.hostname === 'localhost'
					? '../../dist/index.mjs' // local development
					: 'https://unpkg.com/@openmeteo/weather-map-layer@0.1.1/dist/index.mjs' // x-release-please-version
			);

			// Build the Leaflet adapter that intercepts "om://" requests and routes them through omProtocol.
			const leafletAdapter = OMWeatherMapLayer.addLeafletProtocolSupport(L);

			// Register the 'om' protocol handler (same as MapLibre's addProtocol).
			leafletAdapter.addProtocol('om', OMWeatherMapLayer.omProtocol);

			// Create the map. It starts zoomed in: the first bounds update below decides the
			// data window the protocol reads, and a world view reads the whole grid.
			const map = L.map('map').setView([50, 10], 5);
			map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');

			// Keep the protocol informed of the current viewport bounds.
			function updateBounds() {
				const b = map.getBounds();
				OMWeatherMapLayer.updateCurrentBounds([
					b.getWest(),
					b.getSouth(),
					b.getEast(),
					b.getNorth()
				]);
			}
			map.on('moveend', updateBounds);
			updateBounds();

			const omUrl = `https://openmeteo.s3.amazonaws.com/data_spatial/dwd_icon/latest.json?time_step=current_time_1H&variable=precipitation&contours=true`;

			// Raster layer: precipitation colour fill.
			leafletAdapter
				.createTileLayer('om://' + omUrl, {
					opacity: 0.75
				})
				.addTo(map);

			// Vector layer: contour lines drawn on canvas tiles.
			leafletAdapter
				.createVectorTileLayer('om://' + omUrl, {
					style: function (properties) {
						// Only style features in the 'contours' layer.
						if (properties.layer !== 'contours') return null;
						return {
							strokeStyle: 'rgba(0, 0, 0, 0.85)',
							lineWidth: 1,
							lineCap: 'round'
						};
					}
				})
				.addTo(map);

			// Basemap only: a MapLibre style sheet drawn by the maplibre-gl-leaflet plugin, so any own
			// vector style can be used. The plugin is used for nothing but this base layer; the weather
			// layers above are plain Leaflet GridLayers, the protocol and its adapter fully support
			// native Leaflet and do not depend on MapLibre.
			// MapLibre 6 ships as ES module while the plugin expects it as the global `maplibregl`.
			window.maplibregl = await import('https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs');
			await import('https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js');

			// The basemap is added after the weather layers, so it gets its own pane below the
			// tile pane to stay underneath them.
			map.createPane('basemap').style.zIndex = 150;
			L.maplibreGL({
				pane: 'basemap',
				style: 'https://static-assets.open-meteo.com/map-assets/styles/minimal-planet-maps.json', // replace with your own style sheet
				attribution:
					'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
			}).addTo(map);
		</script>
	</body>
</html>
