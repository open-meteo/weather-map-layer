<!doctype html>
<html lang="en">
	<head>
		<title>Open-Meteo Weather Map Layer - Leaflet Wind Arrows Example</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
		<!-- Basemap only: MapLibre + the maplibre-gl-leaflet plugin render a vector style sheet as the Leaflet base layer (see the module script at the end). The weather layers need neither. -->
		<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
		<!-- x-release-please-start-version -->
		<script src="https://unpkg.com/@openmeteo/weather-map-layer@0.1.2/dist/index.js"></script>
		<!-- x-release-please-end -->
		<!-- Local development -->
		<script>
			if (location.hostname === 'localhost' || location.href.startsWith('file://')) {
				document.write('<script src="../../dist/index.js"><\/script>');
			}
		</script>
		<style>
			html,
			body,
			#map {
				margin: 0;
				padding: 0;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script>
			// Build the Leaflet adapter that intercepts "om://" requests and routes them through omProtocol.
			const leafletAdapter = OMWeatherMapLayer.addLeafletProtocolSupport(L);

			// Register the 'om' protocol handler (same as MapLibre's addProtocol).
			leafletAdapter.addProtocol('om', OMWeatherMapLayer.omProtocol);

			// Create the map. It starts zoomed in: the first bounds update below decides the
			// data window the protocol reads, and a world view reads the whole grid.
			const map = L.map('map').setView([50, 10], 5);
			map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');

			// Keep the protocol informed of the current viewport bounds.
			function updateBounds() {
				const b = map.getBounds();
				OMWeatherMapLayer.updateCurrentBounds([
					b.getWest(),
					b.getSouth(),
					b.getEast(),
					b.getNorth()
				]);
			}
			map.on('moveend', updateBounds);
			updateBounds();

			// Both layers share the same model / time step; only the variable differs.
			// The vector layer appends `&arrows=true` to request PBF arrow tiles.
			const omUrl = `https://openmeteo.s3.amazonaws.com/data_spatial/dwd_icon/latest.json?time_step=current_time_1H&variable=wind_u_component_10m`;

			// Raster layer: wind-speed colour fill
			leafletAdapter
				.createTileLayer('om://' + omUrl, {
					opacity: 0.75
				})
				.addTo(map);

			// Vector layer: wind-arrow lines drawn on canvas tiles.
			leafletAdapter
				.createVectorTileLayer('om://' + omUrl + '&arrows=true', {
					style: function (properties) {
						const value = parseFloat(properties.value) || 0;
						const alpha =
							value > 5 ? 0.6 : value > 4 ? 0.5 : value > 3 ? 0.4 : value > 2 ? 0.3 : 0.2;

						const lineWidth = 1; // value > 10 ? 2.5 : value > 5 ? 2 : 1.5;
						return {
							strokeStyle: 'rgba(0, 0, 0, ' + alpha + ')',
							lineWidth: lineWidth,
							lineCap: 'round'
						};
					}
				})
				.addTo(map);
		</script>
		<!-- Basemap only: a MapLibre style sheet drawn by the maplibre-gl-leaflet plugin, so any own vector style can be used.
		     The plugin is used for nothing but this base layer; the weather layers above are plain Leaflet GridLayers, the
		     protocol and its adapter fully support native Leaflet and do not depend on MapLibre.
		     MapLibre 6 ships as ES module while the plugin expects it as the global `maplibregl`, hence a module script. -->
		<script type="module">
			import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs';

			window.maplibregl = maplibregl;
			await import('https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js');

			// Module scripts run after the classic script above, so the basemap gets its own
			// pane below the tile pane to stay underneath the weather layers.
			map.createPane('basemap').style.zIndex = 150;
			L.maplibreGL({
				pane: 'basemap',
				style: 'https://static-assets.open-meteo.com/map-assets/styles/minimal-planet-maps.json', // replace with your own style sheet
				attribution:
					'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
			}).addTo(map);
		</script>
	</body>
</html>
